name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - 'index.html'
      - 'app.js'
      - 'manifest.json'
      - 'IMG_*.png'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ios-app/package-lock.json

      - name: Install dependencies
        working-directory: ios-app
        run: npm ci

      - name: Copy web assets
        working-directory: ios-app
        run: npm run build:web

      - name: Add iOS platform
        working-directory: ios-app
        run: npx cap add ios

      - name: Apply native configuration
        working-directory: ios-app
        run: node scripts/configure-ios.mjs

      - name: Generate native assets (icons/splash)
        working-directory: ios-app
        run: npm run assets:ios

      - name: Sync Capacitor (CocoaPods)
        working-directory: ios-app
        run: npx cap sync ios

      - name: Build app (unsigned)
        working-directory: ios-app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned .ipa
        working-directory: ios-app
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          cd build/ipa && zip -qr ../../SpeakerCleaner.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakerCleaner-ios
          path: ios-app/SpeakerCleaner.ipa
          if-no-files-found: error